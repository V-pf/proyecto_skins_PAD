server:
  port: 8090

spring:
  application:
    name: skins-pad-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowCredentials: true
                allowedOrigins:
                  - http://localhost:5173
                  - http://127.0.0.1:5173
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
          routes:
            - id: usuario-service
              uri: ${USUARIO_URL:http://localhost:8087}
              predicates:
                - Path=/api/auth/**,/api/usuarios/**
            - id: catalogo-service
              uri: ${CATALOGO_URL:http://localhost:8081}
              predicates:
                - Path=/api/productos/**,/api/categorias/**,/api/inventario/publicaciones
            - id: inventario-service
              uri: ${INVENTARIO_SERVICE_URL:http://127.0.0.1:8082}
              predicates:
                - Path=/api/inventario,/api/inventario/**
            - id: steam-service
              uri: ${STEAM_SERVICE_URL:http://127.0.0.1:8088}
              predicates:
                - Path=/api/steam/**
            - id: calificacion-service
              uri: ${CALIFICACION_URL:http://localhost:8089}
              predicates:
                - Path=/api/calificaciones,/api/calificaciones/**
            - id: carrito-service
              uri: ${CARRITO_URL:http://localhost:8083}
              predicates:
                - Path=/api/carritos/**
            - id: pago-service
              uri: ${PAGO_URL:http://localhost:8084}
              predicates:
                - Path=/api/pagos/**,/api/admin/stats,/api/operaciones/**
            - id: ticket-service
              uri: ${TICKET_URL:http://localhost:8085}
              predicates:
                - Path=/api/tickets/**,/api/admin/tickets/**
            - id: acceso-ticket
              uri: ${TICKET_URL:http://localhost:8085}
              predicates:
                - Path=/api/soporte/acceso
                - Query=tipo,TICKET
            - id: reporte-service
              uri: ${REPORTE_URL:http://localhost:8086}
              predicates:
                - Path=/api/reportes/**,/api/admin/reportes/**,/api/admin/soporte/**,/api/soporte/**
