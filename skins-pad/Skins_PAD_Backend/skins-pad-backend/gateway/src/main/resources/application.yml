server:
  port: 8090

spring:
  application:
    name: skins-pad-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:5173
                  - http://127.0.0.1:5173
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
          routes:
            - id: usuario-service
              uri: ${USUARIO_URL:http://localhost:8087}
              predicates:
                - Path=/api/auth/**,/api/usuarios/**
            - id: catalogo-service
              uri: ${CATALOGO_URL:http://localhost:8081}
              predicates:
                - Path=/api/productos/**,/api/categorias/**
            - id: carrito-service
              uri: ${CARRITO_URL:http://localhost:8083}
              predicates:
                - Path=/api/carritos/**
            - id: pago-service
              uri: ${PAGO_URL:http://localhost:8084}
              predicates:
                - Path=/api/pagos/**
