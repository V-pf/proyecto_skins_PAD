server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: 8087
spring:
  application:
    name: skins-pad-usuario
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  datasource:
    url: ${USUARIO_DB_URL:jdbc:mysql://localhost:3306/skinspad_usuario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${USUARIO_DB_USERNAME:root}
    password: ${USUARIO_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

skinspad:
  remitente: ${SMTP_FROM:registro@skinspad.example}
